<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BCKLR PONG - V3 PRO LOADED</title>
    <style>
        body { 
            background: #000; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #d4af37;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* The Scoreboard at the top */
        #scoreboard {
            font-size: 48px;
            margin-bottom: 20px;
            display: flex;
            gap: 100px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        #arena { 
            width: 800px; 
            height: 400px; 
            background: #0a0a0a; 
            border: 4px solid #d4af37; 
            position: relative; 
            cursor: none;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
        }

        /* Centered "You Lose" Message */
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 40px;
            border: 2px solid #d4af37;
            display: none; /* Starts hidden */
            z-index: 100;
            text-align: center;
        }

        #ball { width: 16px; height: 16px; background: #d4af37; position: absolute; box-shadow: 0 0 15px #d4af37; }
        .paddle { width: 16px; height: 85px; background: #d4af37; position: absolute; box-shadow: 0 0 10px #d4af37; }
        #player { left: 20px; }
        #computer { right: 20px; }
    </style>
</head>
<body>

    <div id="scoreboard">
        <div id="pScore">0</div>
        <div id="bScore">0</div>
    </div>

    <div id="arena">
        <div id="overlay">YOU LOST THE ROUND</div>
        <div id="ball"></div>
        <div id="player" class="paddle"></div>
        <div id="computer" class="paddle"></div>
    </div>

    <script>
        const ball = document.getElementById('ball');
        const player = document.getElementById('player');
        const computer = document.getElementById('computer');
        const arena = document.getElementById('arena');
        const overlay = document.getElementById('overlay');
        const pScoreDisplay = document.getElementById('pScore');
        const bScoreDisplay = document.getElementById('bScore');

        // Game State
        let bX = 400, bY = 200; 
        let sX = 6, sY = 6;     
        let pY = 157, cY = 157; 
        let playerScore = 0, botScore = 0;

        // Player Paddle Logic
        arena.addEventListener('mousemove', (e) => {
            let rect = arena.getBoundingClientRect();
            let mouseY = e.clientY - rect.top - 42; 
            if (mouseY < 0) pY = 0;
            else if (mouseY > 315) pY = 315;
            else pY = mouseY;
            player.style.top = pY + 'px';
        });

        // Function to handle scoring
        function score(winner) {
            if (winner === 'bot') {
                botScore++;
                bScoreDisplay.innerText = botScore;
                overlay.style.display = "block";
                setTimeout(() => { overlay.style.display = "none"; }, 1000);
            } else {
                playerScore++;
                pScoreDisplay.innerText = playerScore;
            }
            // Reset Ball
            bX = 400; bY = 200;
            sX = (sX > 0) ? -6 : 6; // Hit it toward the winner
            sY = 6;
        }

        function engine() {
            bX += sX;
            bY += sY;

            // Wall Bounces
            if (bY <= 0 || bY >= 384) sY *= -1;

            // --- SMARTER AI ---
            // Only "watches" and moves if ball is past the halfway mark (400px)
            if (bX > 350) {
                let centerOfPaddle = cY + 42;
                if (centerOfPaddle < bY - 10) {
                    cY += 7; // Moving down to catch ball
                } else if (centerOfPaddle > bY + 10) {
                    cY -= 7; // Moving up to catch ball
                }
            }

            // Lock Computer Paddle
            if (cY < 0) cY = 0;
            if (cY > 315) cY = 315;
            computer.style.top = cY + 'px';

            // Collision: Player
            if (bX <= 36 && bY > pY && bY < pY + 85) {
                sX *= -1.1; 
                bX = 37; // Push ball out
            }

            // Collision: Computer
            if (bX >= 748 && bY > cY && bY < cY + 85) {
                sX *= -1.1;
                bX = 747; // Push ball out
            }

            // Scoring Checks
            if (bX < 0) score('bot');
            if (bX > 800) score('player');

            // Render positions
            ball.style.left = bX + 'px';
            ball.style.top = bY + 'px';

            requestAnimationFrame(engine);
        }

        engine();
    </script>
</body>
</html>
